plugins {
    id "com.android.application"
}

android {
    namespace "cc.wechat.observatory"
    compileSdk 35

    signingConfigs {
        debug {
            def persistentKeystore = System.getenv("OBSERVATORY_DEBUG_KEYSTORE")
            if (persistentKeystore) {
                storeFile file(persistentKeystore)
                storeType "PKCS12"
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId "cc.wechat.observatory"
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName "0.1.3-fork.2"
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
    testImplementation "junit:junit:4.13.2"
}
