name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/wechat-8079, fix/lsposed-shared-config, fix/settings-switch-layout]
    paths:
      - 'android-module/**'
      - '.github/workflows/android-apk.yml'
      - 'internal/**'
      - 'cmd/**'
      - 'go.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.9'
      - name: Restore persistent fork debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/observatory-debug.keystore"
          chmod 600 "$RUNNER_TEMP/observatory-debug.keystore"
          echo "OBSERVATORY_DEBUG_KEYSTORE=$RUNNER_TEMP/observatory-debug.keystore" >> "$GITHUB_ENV"
      - name: Test and build installable APK
        working-directory: android-module
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify and package
        run: |
          mkdir -p artifacts
          cp android-module/app/build/outputs/apk/debug/app-debug.apk artifacts/wechat-observatory-0.1.16-wechat8079-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs artifacts/*.apk > artifacts/apk-verification.txt
          grep -F "Signer #1 certificate SHA-256 digest: 6b95e8c196f30a26b0f1dd0d9be43d08d2714cc0a2614dce2f33165043996f4e" artifacts/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/*.apk > artifacts/apk-package.txt
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
          cd artifacts
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wechat-observatory-apk
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-unit-test-results
          path: android-module/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: observatory_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: test -z "$(gofmt -l internal/bridge/connection_probe.go internal/bridge/connection_probe_test.go)"
      - name: Test server and MySQL account-session migrations
        env:
          WECHAT_OBSERVATORY_MYSQL_TEST_DSN: root:ci-test-password@tcp(127.0.0.1:3306)/observatory_test?charset=utf8mb4&parseTime=true&loc=UTC
        run: go test -race ./...
      - name: Build matching server binaries
        run: |
          mkdir -p artifacts
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o artifacts/wechat-observatory ./cmd/bridge
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o artifacts/wechat-observatory-db ./cmd/bridge-db
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
          cd artifacts
          sha256sum wechat-observatory wechat-observatory-db > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wechat-observatory-server-linux-amd64
          path: artifacts/
          if-no-files-found: error
