name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-module/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent fork debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/observatory-debug.keystore"
          chmod 600 "$RUNNER_TEMP/observatory-debug.keystore"
          echo "OBSERVATORY_DEBUG_KEYSTORE=$RUNNER_TEMP/observatory-debug.keystore" >> "$GITHUB_ENV"
      - name: Test and build installable APK
        working-directory: android-module
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify and package
        run: |
          mkdir -p artifacts
          cp android-module/app/build/outputs/apk/debug/app-debug.apk artifacts/wechat-observatory-0.1.3-fork.2-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs artifacts/*.apk > artifacts/apk-verification.txt
          grep -F "Signer #1 certificate SHA-256 digest: 6b95e8c196f30a26b0f1dd0d9be43d08d2714cc0a2614dce2f33165043996f4e" artifacts/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging artifacts/*.apk > artifacts/apk-package.txt
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
          cd artifacts
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-observatory-apk
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-results
          path: android-module/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
